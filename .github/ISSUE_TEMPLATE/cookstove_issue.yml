name: "Report a Problem or Request a Change"
description: "Use this simple form to report a bug, calculation issue, or requested improvement"
title: "[Feedback]: "
labels: ["needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for reporting!
        Please fill out this quick form in plain words. This gives the team and our coding assistant the exact details needed to understand what happened and prepare a fix for review.

  - type: dropdown
    id: program_screen
    attributes:
      label: "Which program or tool were you using?"
      description: "Pick the tool you were working with when this came up."
      options:
        - "L1 Data Entry (Window where you type in fuel weights, pot weights, and moisture)"
        - "L2 or L3 Summary Tool (Comparing multiple tests or stoves together)"
        - "Data Cruncher ISO (The main script that calculates emissions and efficiency)"
        - "Data Cruncher IDC (India domestic stove script)"
        - "MusaPlotter (Live sensor graphs and logging)"
        - "Black Carbon / Filter Camera Tool (IANA)"
        - "Making the Windows app / Installer (.exe)"
        - "Not sure / Something else"
    validations:
      required: true

  - type: dropdown
    id: test_type
    attributes:
      label: "What kind of test was this?"
      description: "If this relates to a specific stove test protocol, choose it here."
      options:
        - "ISO 19867-1 (Standard clean cookstove lab test)"
        - "IDC (India Domestic Cookstove)"
        - "WBT (Water Boiling Test)"
        - "Not tied to a specific test protocol"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: "What went wrong?"
      description: "Describe what you were trying to do, what buttons you clicked, and what happened on screen. If an error message or terminal pop-up appeared, please paste the text here."
      placeholder: "Example: I was in the L1 Data Entry window. I entered a start water weight of 5.0 kg, but forgot the end water weight. The app let me save without warning, and then the cruncher crashed later with an error saying division by zero."
    validations:
      required: true

  - type: textarea
    id: what_should_happen
    attributes:
      label: "What should happen instead?"
      description: "In simple words, what is the correct behavior or number you expected to see?"
      placeholder: "Example: The window should pop up a red reminder saying 'Please enter the end water weight before saving', and refuse to close until it's filled in."
    validations:
      required: true

  - type: input
    id: test_folder_or_file
    attributes:
      label: "Which test folder or file has this data?"
      description: "Name of the folder inside 'Stove tests' (like '09.09.26') or the name of the CSV / Excel file."
      placeholder: "Example: Stove tests/09.09.26 or test_run_data.xlsx"
    validations:
      required: false

  - type: textarea
    id: how_to_check
    attributes:
      label: "How should we test that the fix worked?"
      description: "How can someone on the team verify the problem is completely solved?"
      placeholder: "Example: Open L1, leave end water weight blank, click Save, and make sure the new warning appears."
    validations:
      required: false
